<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Final branding screenshots</title><style>body{font:16px/1.5 Arial;color:#1f2937;background:#faf9f6;padding:24px;margin:0}h1{font-size:26px}select{font:inherit;min-height:48px;padding:10px;max-width:100%}main{display:grid;grid-template-columns:2fr 1fr;gap:30px;margin-top:24px;align-items:start}img{width:100%;height:auto;border:1px solid #ddd}figure{margin:0;min-width:0}figcaption{margin-bottom:12px}a{color:inherit}@media(max-width:650px){main{grid-template-columns:1fr}}</style></head><body><h1>Final branding review</h1><p>Full-resolution desktop and mobile screenshots. <a href="README.md">Readiness report</a> · <a href="brand-board.html">Logo assets</a></p><label>Choose a page <select id="page"><option value="landing">Red Spectrum landing</option><option value="forge">forge / home</option><option value="forge-services">forge / services</option><option value="forge-about">forge / about</option><option value="forge-contact">forge / contact</option><option value="forge-privacy">forge / privacy</option><option value="ledger">ledger / home</option><option value="ledger-services">ledger / services</option><option value="ledger-about">ledger / about</option><option value="ledger-contact">ledger / contact</option><option value="ledger-privacy">ledger / privacy</option><option value="stillwater">stillwater / home</option><option value="stillwater-services">stillwater / services</option><option value="stillwater-about">stillwater / about</option><option value="stillwater-contact">stillwater / contact</option><option value="stillwater-privacy">stillwater / privacy</option></select></label><main><figure><figcaption>Desktop · 1440px</figcaption><a id="desktop-link"><img id="desktop" alt="Desktop screenshot"></a></figure><figure><figcaption>Mobile · 390px</figcaption><a id="mobile-link"><img id="mobile" alt="Mobile screenshot"></a></figure></main><script>const choice=document.getElementById('page');function update(){for(const size of ['desktop','mobile']){const file=choice.value+'-'+size+'.png';document.getElementById(size).src=file;document.getElementById(size).alt=choice.options[choice.selectedIndex].text+' '+size;document.getElementById(size+'-link').href=file}}choice.addEventListener('change',update);update();</script></body></html>
