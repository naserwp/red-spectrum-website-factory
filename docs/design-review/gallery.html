<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RS Factory — design comparison</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f3f0;color:#172a30;font:16px/1.5 Arial,sans-serif}header{padding:24px 32px;background:#172a30;color:white}h1{font-size:26px;margin:0 0 8px}p{margin:0}.controls{display:flex;gap:24px;flex-wrap:wrap;padding:24px 32px}label{display:grid;gap:6px;font-weight:bold}select{min-height:44px;padding:8px 36px 8px 12px;font:inherit;border:1px solid #708078;border-radius:4px}main{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:0 32px 32px;align-items:start}figure{margin:0;min-width:0}figcaption{font-size:20px;margin-bottom:12px;font-weight:bold}img{display:block;width:100%;height:auto;border:1px solid #d2d6cf}main.mobile img{max-width:390px}a{color:inherit}footer{padding:20px 32px}@media(max-width:700px){main{grid-template-columns:1fr}.controls{gap:12px}}
</style></head><body><header><h1>Three directions. One factory.</h1><p>Template previews only · Before / after · September 2026</p></header><div class="controls"><label>Template<select id="template"><option value="forge">Forge & Field — home services</option><option value="ledger">Ledger & Line — professional services</option><option value="stillwater">Stillwater — wellness</option></select></label><label>Page<select id="page"><option value="home">Home</option><option value="services">Services</option><option value="about">About</option><option value="contact">Contact</option><option value="privacy">Privacy</option></select></label><label>Viewport<select id="size"><option value="desktop">Desktop · 1440px</option><option value="mobile">Mobile · 390px</option></select></label></div><main><figure><figcaption>Before</figcaption><a id="before-link"><img id="before" alt="Original template screenshot"></a></figure><figure><figcaption>After</figcaption><a id="after-link"><img id="after" alt="Updated template screenshot"></a></figure></main><footer>All business content is illustrative draft. Click either image for the full-resolution capture. <a href="README.md">Read the verification report</a>.</footer><script>
const template=document.getElementById('template'),page=document.getElementById('page'),size=document.getElementById('size');
function update(){const name=template.value+(page.value==='home'?'':'-'+page.value)+'-'+size.value+'.png';document.querySelector('main').className=size.value;for(const version of ['before','after']){document.getElementById(version).src=version+'/'+name;document.getElementById(version).alt=version+' — '+template.value+' '+page.value+' '+size.value;document.getElementById(version+'-link').href=version+'/'+name}}
for(const control of [template,page,size])control.addEventListener('change',update);update();
</script></body></html>
